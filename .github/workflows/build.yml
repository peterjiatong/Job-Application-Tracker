# Runs on every push and pull request: type-check, unit tests, production build.
# On a push to main it also publishes the build as the "latest" release, so there is always a
# ready-made zip to download:
#   https://github.com/<owner>/<repo>/releases/latest/download/job-application-tracker-chrome.zip
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write # needed to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm test
      - run: pnpm zip

      - name: Publish the latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          # A fixed file name, so the download link stays the same from build to build.
          cp ".output/job-application-tracker-${version}-chrome.zip" job-application-tracker-chrome.zip

          # One release, replaced on every push. Its tag moves to the new commit.
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest job-application-tracker-chrome.zip \
            --target "$GITHUB_SHA" \
            --title "Latest build (v${version})" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}.

          To install: download \`job-application-tracker-chrome.zip\`, unzip it, open \`chrome://extensions\`, turn on Developer mode, click **Load unpacked** and choose the unzipped folder. See the README for details."
